[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oximoron"
version = "0.1.0"
description = "Local-first desktop AI orchestration platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "OXIMORON Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13.2",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    "pynvml>=11.5.0",
    "typer>=0.12.5",
    "keyring>=25.3.0",
    "rich>=13.7.1",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
oximoron = "apps.cli.main:app"
oximoron-backend = "apps.backend.main:run_server"

[tool.hatch.build.targets.wheel]
packages = ["core", "engines", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "unit: pure unit tests",
    "contract: adapter contract tests against fixtures/mocks",
    "integration: integration tests with filesystem, DB, or processes",
    "live_engine: tests requiring real installed local engines",
    "hardware: tests requiring physical GPU hardware",
]
